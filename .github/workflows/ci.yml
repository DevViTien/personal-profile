name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Lint · i18n · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check i18n sync (6 languages)
        run: npm run check:i18n

      - name: Run tests
        run: npm test -- --ci

      - name: Build
        run: npm run build
        env:
          # EmailJS là client-side public keys — dùng placeholder cho build CI
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ci_placeholder
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: ci_placeholder
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ci_placeholder
          NEXT_PUBLIC_CONTACT_EMAIL: ci@example.com
